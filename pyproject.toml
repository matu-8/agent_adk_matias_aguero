[project]
name = "vulnerabilities_alert_agent"
version = "0.1.0"
description = "Monitor autónomo de vulnerabilidades de ciberseguridad con Google ADK"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-adk==2.13.0",
    "litellm==1.105.1",
    "chromadb==1.5.9",
    "langchain-chroma==1.1.0",
    "langchain-ollama==1.1.0",
    "langchain-text-splitters==1.1.3",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
]

[tool.uv]
# El proyecto no es un paquete instalable: se ejecuta desde el código fuente.
package = false
